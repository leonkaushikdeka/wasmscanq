<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatiq - Genomic Visualization Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px 32px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 65px);
        }

        .sidebar {
            width: 320px;
            background: #0f0f18;
            border-right: 1px solid #2a2a4a;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 16px;
        }

        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-drop-zone {
            border: 2px dashed #3a3a5a;
            border-radius: 8px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-drop-zone:hover,
        .file-drop-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .file-drop-zone input {
            display: none;
        }

        .file-type-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .file-type-tab {
            flex: 1;
            padding: 8px;
            background: #2a2a4a;
            border: none;
            border-radius: 4px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-type-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .loaded-files {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .loaded-file {
            background: #0f0f18;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .file-icon.bam { background: rgba(102, 126, 234, 0.2); color: #667eea; }
        .file-icon.vcf { background: rgba(74, 222, 128, 0.2); color: #4ade80; }

        .loaded-file-info {
            flex: 1;
            min-width: 0;
        }

        .loaded-file-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loaded-file-meta {
            font-size: 10px;
            color: #888;
        }

        .remove-file {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .remove-file:hover {
            opacity: 1;
        }

        .nav-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .nav-row label {
            font-size: 12px;
            color: #888;
            min-width: 60px;
        }

        .nav-row input,
        .nav-row select {
            flex: 1;
            background: #0f0f18;
            border: 1px solid #2a2a4a;
            border-radius: 4px;
            padding: 8px 10px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .nav-row input:focus,
        .nav-row select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #2a2a4a;
        }

        .btn-secondary:hover {
            background: #3a3a5a;
            box-shadow: none;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0f;
        }

        .viewer-toolbar {
            background: #0f0f18;
            border-bottom: 1px solid #2a2a4a;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zoom-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background: #2a2a4a;
            border: none;
            color: #e0e0e0;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            background: #3a3a5a;
        }

        .position-display {
            font-size: 12px;
            color: #888;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .viewer-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .coverage-container {
            height: 120px;
            background: #0a0a0f;
            border-bottom: 1px solid #2a2a4a;
        }

        .read-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #coverage-canvas {
            width: 100%;
            height: 100%;
        }

        #read-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #read-canvas:active {
            cursor: grabbing;
        }

        .variant-markers {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            pointer-events: none;
        }

        .variant-marker {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            top: 6px;
            transform: translateX(-50%);
            cursor: pointer;
            pointer-events: auto;
        }

        .variant-marker.snvs { background: #fbbf24; }
        .variant-marker.insertions { background: #4ade80; }
        .variant-marker.deletions { background: #f87171; }

        .stats-panel {
            background: #0f0f18;
            border-top: 1px solid #2a2a4a;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .status-bar {
            background: #0a0a0f;
            border-top: 1px solid #2a2a4a;
            padding: 8px 20px;
            font-size: 12px;
            color: #888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.loading {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            color: #4ade80;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 16px;
            color: #888;
        }

        .ruler {
            height: 24px;
            background: #0f0f18;
            border-bottom: 1px solid #2a2a4a;
            position: relative;
        }

        .ruler-tick {
            position: absolute;
            bottom: 0;
            font-size: 9px;
            color: #666;
            transform: translateX(-50%);
        }

        .ruler-tick::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 1px;
            height: 6px;
            background: #3a3a5a;
        }

        .filter-section {
            margin-top: 12px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .filter-row label {
            font-size: 11px;
            color: #888;
            min-width: 50px;
        }

        .filter-row input[type="range"] {
            flex: 1;
            accent-color: #667eea;
        }

        .filter-row span {
            font-size: 11px;
            color: #667eea;
            min-width: 30px;
            text-align: right;
        }

        .quick-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 12px;
        }

        .quick-nav-btn {
            padding: 8px 4px;
            background: #2a2a4a;
            border: none;
            border-radius: 4px;
            color: #888;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .info-tooltip {
            position: fixed;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 12px;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .info-tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">C</div>
            <span class="logo-text">Chromatiq</span>
        </div>
        <div class="header-actions">
            <div class="privacy-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                100% Client-Side
            </div>
            <button class="btn btn-secondary btn-small" id="share-btn">Share View</button>
            <button class="btn btn-secondary btn-small" id="export-btn">Export PNG</button>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <section class="sidebar-section">
                <div class="sidebar-title">Data Files</div>
                <div class="file-type-tabs">
                    <button class="file-type-tab active" data-type="bam">BAM</button>
                    <button class="file-type-tab" data-type="vcf">VCF</button>
                </div>
                <div class="file-drop-zone" id="drop-zone">
                    <input type="file" id="file-input" accept=".bam,.cram,.vcf,.vcf.gz">
                    <div class="file-drop-text">Drop files here</div>
                    <div class="file-drop-hint" id="drop-hint">or click to browse BAM files</div>
                </div>
                <div class="loaded-files" id="loaded-files"></div>
            </section>

            <section class="sidebar-section">
                <div class="sidebar-title">Navigation</div>
                <div class="nav-row">
                    <label>Reference</label>
                    <select id="ref-select">
                        <option value="">Load a file first</option>
                    </select>
                </div>
                <div class="nav-row">
                    <label>Start</label>
                    <input type="number" id="start-input" value="0">
                </div>
                <div class="nav-row">
                    <label>End</label>
                    <input type="number" id="end-input" value="1000000">
                </div>
                <button class="btn" id="go-btn" style="width: 100%;">Go to Region</button>

                <div class="quick-nav">
                    <button class="quick-nav-btn" data-preset="exon">Exon</button>
                    <button class="quick-nav-btn" data-preset="gene">Gene</button>
                    <button class="quick-nav-btn" data-preset="region">Region</button>
                    <button class="quick-nav-btn" data-preset="all">Full</button>
                </div>
            </section>

            <section class="sidebar-section">
                <div class="sidebar-title">Filters</div>
                <div class="filter-section">
                    <div class="filter-row">
                        <label>Min MQ</label>
                        <input type="range" id="min-mapq" min="0" max="60" value="0">
                        <span id="min-mapq-val">0</span>
                    </div>
                    <div class="filter-row">
                        <label>Min BQ</label>
                        <input type="range" id="min-baseq" min="0" max="40" value="0">
                        <span id="min-baseq-val">0</span>
                    </div>
                </div>
            </section>

            <section class="sidebar-section">
                <div class="sidebar-title">Actions</div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button class="btn btn-secondary" id="find-variants-btn">Find Variants</button>
                    <button class="btn btn-secondary" id="show-variants-btn">Show/Hide Variants</button>
                </div>
            </section>
        </aside>

        <div class="viewer-area">
            <div class="viewer-toolbar">
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoom-out">−</button>
                    <span class="position-display" id="zoom-level">100%</span>
                    <button class="zoom-btn" id="zoom-in">+</button>
                    <button class="zoom-btn" id="zoom-fit">⊡</button>
                </div>
                <div class="position-display" id="region-display">chr1:0-1,000,000</div>
                <div style="flex: 1;"></div>
                <div class="position-display" id="cursor-pos">Pos: -</div>
            </div>

            <div class="ruler" id="ruler"></div>

            <div class="viewer-content">
                <div class="coverage-container">
                    <canvas id="coverage-canvas"></canvas>
                </div>
                <div class="read-container">
                    <canvas id="read-canvas"></canvas>
                    <div class="variant-markers" id="variant-markers"></div>
                    <div class="loading-overlay hidden" id="loading">
                        <div class="spinner"></div>
                        <div class="loading-text" id="loading-text">Processing...</div>
                    </div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stat-item">
                    <div class="stat-value" id="stat-reads">-</div>
                    <div class="stat-label">Reads</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-depth">-</div>
                    <div class="stat-label">Avg Depth</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-max">-</div>
                    <div class="stat-label">Max Depth</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-variants">-</div>
                    <div class="stat-label">Variants</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-mapped">-</div>
                    <div class="stat-label">Mapped</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-mapq">-</div>
                    <div class="stat-label">Mean MQ</div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Ready</span>
                </div>
                <div id="memory-usage"></div>
                <div id="file-info"></div>
            </div>
        </div>
    </main>

    <div class="info-tooltip" id="tooltip"></div>

    <script type="module">
        import init, { ChromatiqEngine, getVersion, getInfo, getCapabilities } from './pkg/chromatiq_wasm.js';

        let engine = null;
        let currentRegion = { ref: 'chr1', start: 0, end: 1000000 };
        let zoom = 1.0;
        let coverageData = null;
        let pileupData = null;
        let variantData = [];
        let showVariants = true;
        let isLoading = false;
        let currentFileType = 'bam';

        const readCanvas = document.getElementById('read-canvas');
        const readCtx = readCanvas.getContext('2d');
        const coverageCanvas = document.getElementById('coverage-canvas');
        const coverageCtx = coverageCanvas.getContext('2d');

        async function initialize() {
            try {
                await init();
                engine = new ChromatiqEngine();

                document.title = `Chromatiq v${getVersion()}`;
                console.log(getInfo());
                console.log('Capabilities:', getCapabilities());

                setupEventListeners();
                resizeCanvases();
                renderPlaceholder();

                updateStatus('Ready', 'ready');
            } catch (error) {
                console.error('Failed to initialize:', error);
                updateStatus('Initialization failed', 'error');
            }
        }

        function setupEventListeners() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');

            document.querySelectorAll('.file-type-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    document.querySelectorAll('.file-type-tab').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFileType = e.target.dataset.type;
                    document.getElementById('drop-hint').textContent =
                        currentFileType === 'vcf' ? 'or click to browse VCF files' : 'or click to browse BAM files';
                    fileInput.accept = currentFileType === 'vcf' ? '.vcf,.vcf.gz' : '.bam,.cram';
                });
            });

            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', handleFileDrop);
            fileInput.addEventListener('change', handleFileSelect);

            document.getElementById('go-btn').addEventListener('click', navigateToRegion);
            document.getElementById('zoom-in').addEventListener('click', () => adjustZoom(1.5));
            document.getElementById('zoom-out').addEventListener('click', () => adjustZoom(0.67));
            document.getElementById('zoom-fit').addEventListener('click', () => {
                zoom = 1.0;
                document.getElementById('zoom-level').textContent = '100%';
                if (coverageData) renderCoverage();
                if (pileupData) renderReads();
            });

            document.getElementById('share-btn').addEventListener('click', shareView);
            document.getElementById('export-btn').addEventListener('click', exportView);
            document.getElementById('find-variants-btn').addEventListener('click', findVariants);
            document.getElementById('show-variants-btn').addEventListener('click', toggleVariants);

            ['min-mapq', 'min-baseq'].forEach(id => {
                const input = document.getElementById(id);
                const valueSpan = document.getElementById(`${id}-val`);
                input.addEventListener('input', () => {
                    valueSpan.textContent = input.value;
                    if (pileupData) renderReads();
                });
            });

            document.querySelectorAll('.quick-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => handleQuickNav(btn.dataset.preset));
            });

            window.addEventListener('resize', () => {
                resizeCanvases();
                renderRuler();
                if (coverageData) renderCoverage();
                if (pileupData) renderReads();
            });

            readCanvas.addEventListener('mousemove', handleCanvasHover);
            readCanvas.addEventListener('mouseleave', hideTooltip);
        }

        async function handleFileDrop(e) {
            e.preventDefault();
            document.getElementById('drop-zone').classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                await loadFile(files[0]);
            }
        }

        async function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                await loadFile(files[0]);
            }
        }

        async function loadFile(file) {
            setLoading(true, `Loading ${file.name}...`);

            try {
                const buffer = await file.arrayBuffer();
                const data = new Uint8Array(buffer);

                if (file.name.toLowerCase().endsWith('.vcf') || file.name.toLowerCase().endsWith('.vcf.gz')) {
                    const idx = engine.load_vcf(data);
                    console.log(`Loaded VCF file at index ${idx}`);
                    variantData = engine.get_all_variants();
                    updateLoadedFilesList();
                    updateStatus(`Loaded VCF: ${file.name}`, 'ready');
                } else {
                    const idx = engine.load_bam(data);
                    console.log(`Loaded BAM file at index ${idx}`);
                    updateReferenceSelect();
                    updateLoadedFilesList();
                    updateStatus(`Loaded BAM: ${file.name}`, 'ready');

                    if (!coverageData) {
                        await loadRegionData();
                    }
                }
            } catch (error) {
                console.error('Failed to load file:', error);
                updateStatus(`Failed to load ${file.name}`, 'error');
            }

            setLoading(false);
        }

        function updateLoadedFilesList() {
            const container = document.getElementById('loaded-files');
            const bamCount = engine.get_bam_file_count();
            const vcfCount = engine.get_vcf_file_count();

            let html = '';
            for (let i = 0; i < bamCount; i++) {
                html += `
                    <div class="loaded-file">
                        <div class="file-icon bam">BAM</div>
                        <div class="loaded-file-info">
                            <div class="loaded-file-name">Alignment ${i + 1}</div>
                            <div class="loaded-file-meta">Loaded</div>
                        </div>
                        <button class="remove-file" onclick="removeBamFile(${i})">×</button>
                    </div>
                `;
            }
            for (let i = 0; i < vcfCount; i++) {
                html += `
                    <div class="loaded-file">
                        <div class="file-icon vcf">VCF</div>
                        <div class="loaded-file-info">
                            <div class="loaded-file-name">Variants ${i + 1}</div>
                            <div class="loaded-file-meta">${variantData[i]?.length || 0} variants</div>
                        </div>
                        <button class="remove-file" onclick="removeVcfFile(${i})">×</button>
                    </div>
                `;
            }
            container.innerHTML = html || '<div style="color: #666; font-size: 12px; text-align: center;">No files loaded</div>';
        }

        function updateReferenceSelect() {
            const select = document.getElementById('ref-select');
            if (engine.get_bam_file_count() > 0) {
                const names = engine.bam_files[0].get_reference_names();
                select.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
                if (currentRegion.ref === 'chr1' && !names.includes('chr1')) {
                    currentRegion.ref = names[0] || 'chr1';
                }
            }
        }

        async function loadRegionData() {
            if (engine.get_bam_file_count() === 0) return;

            setLoading(true, 'Calculating coverage...');

            try {
                coverageData = engine.calculate_combined_coverage(
                    currentRegion.ref,
                    currentRegion.start,
                    currentRegion.end
                );

                updateStats();
                renderCoverage();
                renderRuler();

                if (document.getElementById('min-mapq').value > 0 || document.getElementById('min-baseq').value > 0) {
                    const minMapq = parseInt(document.getElementById('min-mapq').value);
                    const minBaseq = parseInt(document.getElementById('min-baseq').value);

                    pileupData = engine.bam_files[0].generate_pileup(
                        currentRegion.ref,
                        currentRegion.start,
                        currentRegion.end,
                        minMapq,
                        minBaseq
                    );
                    renderReads();
                }

                setLoading(false);
            } catch (error) {
                console.error('Failed to load region:', error);
                setLoading(false);
            }
        }

        function navigateToRegion() {
            const ref = document.getElementById('ref-select').value;
            const start = parseInt(document.getElementById('start-input').value);
            const end = parseInt(document.getElementById('end-input').value);

            if (start >= end) {
                alert('End must be greater than start');
                return;
            }

            currentRegion = { ref, start, end };
            document.getElementById('region-display').textContent =
                `${ref}:${start.toLocaleString()}-${end.toLocaleString()}`;

            loadRegionData();
        }

        function handleQuickNav(preset) {
            const ref = currentRegion.ref;
            let start, end;

            switch (preset) {
                case 'exon':
                    start = currentRegion.start;
                    end = currentRegion.start + 200;
                    break;
                case 'gene':
                    start = currentRegion.start;
                    end = currentRegion.start + 10000;
                    break;
                case 'region':
                    start = currentRegion.start;
                    end = currentRegion.start + 100000;
                    break;
                case 'all':
                    if (engine.get_bam_file_count() > 0) {
                        const names = engine.bam_files[0].get_reference_names();
                        const refIdx = names.indexOf(ref);
                        const refInfo = engine.bam_files[0].get_reference(refIdx);
                        if (refInfo) {
                            start = 0;
                            end = Math.min(refInfo.length, 10000000);
                        } else {
                            return;
                        }
                    } else {
                        return;
                    }
                    break;
                default:
                    return;
            }

            currentRegion = { ref, start, end };
            document.getElementById('start-input').value = start;
            document.getElementById('end-input').value = end;
            document.getElementById('region-display').textContent =
                `${ref}:${start.toLocaleString()}-${end.toLocaleString()}`;

            loadRegionData();
        }

        function adjustZoom(factor) {
            zoom = Math.max(0.1, Math.min(20, zoom * factor));
            document.getElementById('zoom-level').textContent = `${Math.round(zoom * 100)}%`;

            renderRuler();
            if (coverageData) renderCoverage();
            if (pileupData) renderReads();
        }

        function resizeCanvases() {
            const container = coverageCanvas.parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;

            coverageCanvas.width = width * window.devicePixelRatio;
            coverageCanvas.height = height * window.devicePixelRatio;
            coverageCanvas.style.width = `${width}px`;
            coverageCanvas.style.height = `${height}px`;
            coverageCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const readContainer = readCanvas.parentElement;
            readCanvas.width = readContainer.clientWidth * window.devicePixelRatio;
            readCanvas.height = readContainer.clientHeight * window.devicePixelRatio;
            readCanvas.style.width = `${readContainer.clientWidth}px`;
            readCanvas.style.height = `${readContainer.clientHeight}px`;
            readCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function renderPlaceholder() {
            readCtx.fillStyle = '#0a0a0f';
            readCtx.fillRect(0, 0, readCanvas.width, readCanvas.height);

            readCtx.fillStyle = '#2a2a4a';
            readCtx.font = '14px -apple-system, sans-serif';
            readCtx.textAlign = 'center';
            readCtx.fillText(
                'Load BAM/CRAM files to begin',
                readCanvas.width / (2 * window.devicePixelRatio),
                readCanvas.height / (2 * window.devicePixelRatio)
            );
        }

        function renderRuler() {
            const ruler = document.getElementById('ruler');
            ruler.innerHTML = '';

            const width = readCanvas.clientWidth;
            const regionWidth = currentRegion.end - currentRegion.start;
            const pixelsPerBase = (width / regionWidth) * zoom;

            const tickInterval = getTickInterval(regionWidth / zoom);

            for (let pos = Math.ceil(currentRegion.start / tickInterval) * tickInterval; pos < currentRegion.end; pos += tickInterval) {
                const x = ((pos - currentRegion.start) / regionWidth) * width;
                const tick = document.createElement('div');
                tick.className = 'ruler-tick';
                tick.style.left = `${x}px`;
                tick.textContent = formatNumber(pos);
                ruler.appendChild(tick);
            }
        }

        function getTickInterval(pxWidth) {
            if (pxWidth < 100) return 1000;
            if (pxWidth < 200) return 5000;
            if (pxWidth < 500) return 10000;
            if (pxWidth < 1000) return 50000;
            return 100000;
        }

        function formatNumber(n) {
            if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
            if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
            return n.toString();
        }

        function renderCoverage() {
            if (!coverageData) return;

            const width = coverageCanvas.clientWidth;
            const height = coverageCanvas.clientHeight;

            coverageCtx.fillStyle = '#0a0a0f';
            coverageCtx.fillRect(0, 0, width, height);

            const values = coverageData.values;
            if (values.length === 0) return;

            const maxDepth = Math.max(...values, 1);
            const barWidth = width / values.length;

            for (let i = 0; i < values.length; i++) {
                const barHeight = (values[i] / maxDepth) * (height - 10);
                const x = i * barWidth;
                const y = height - barHeight - 5;

                if (values[i] === 0) {
                    coverageCtx.fillStyle = 'rgba(100, 100, 120, 0.3)';
                } else {
                    const gradient = coverageCtx.createLinearGradient(x, y, x, height - 5);
                    gradient.addColorStop(0, 'rgba(102, 126, 234, 0.8)');
                    gradient.addColorStop(1, 'rgba(118, 75, 162, 0.4)');
                    coverageCtx.fillStyle = gradient;
                }
                coverageCtx.fillRect(x, y, Math.max(barWidth * zoom, 1), barHeight);
            }

            coverageCtx.strokeStyle = '#3a3a5a';
            coverageCtx.beginPath();
            coverageCtx.moveTo(0, height - 5);
            coverageCtx.lineTo(width, height - 5);
            coverageCtx.stroke();
        }

        function renderReads() {
            if (!pileupData) return;

            const width = readCanvas.clientWidth;
            const height = readCanvas.clientHeight;

            readCtx.fillStyle = '#0a0a0f';
            readCtx.fillRect(0, 0, width, height);

            const regionWidth = currentRegion.end - currentRegion.start;
            const pixelsPerBase = (width / regionWidth) * zoom;
            const rowHeight = 10;

            const minBaseq = parseInt(document.getElementById('min-baseq').value);

            pileupData.columns.forEach((column, colIdx) => {
                const x = colIdx * (width / pileupData.columns.length) * zoom;

                column.reads.slice(0, Math.floor(height / rowHeight) - 1).forEach((read, readIdx) => {
                    if (read.quality < minBaseq) return;

                    const y = 10 + readIdx * rowHeight;

                    if (read.is_deletion) {
                        readCtx.fillStyle = 'rgba(248, 113, 113, 0.7)';
                        readCtx.fillRect(x, y, Math.max(pixelsPerBase, 2), rowHeight - 2);
                    } else {
                        readCtx.fillStyle = getBaseColor(read.base);
                        readCtx.fillRect(x, y, Math.max(pixelsPerBase, 2), rowHeight - 2);
                    }

                    if (read.is_reverse) {
                        readCtx.fillStyle = '#666';
                        readCtx.fillRect(x, y + rowHeight - 3, Math.max(pixelsPerBase, 2), 1);
                    }
                });
            });

            renderVariantMarkers(width);
        }

        function renderVariantMarkers(canvasWidth) {
            const container = document.getElementById('variant-markers');
            container.innerHTML = '';

            if (!showVariants) return;

            const regionWidth = currentRegion.end - currentRegion.start;

            variantData.forEach((fileVariants, fileIdx) => {
                if (!fileVariants) return;

                fileVariants.forEach(variant => {
                    if (variant.chrom !== currentRegion.ref) return;
                    if (variant.pos < currentRegion.start || variant.pos >= currentRegion.end) return;

                    const x = ((variant.pos - currentRegion.start) / regionWidth) * canvasWidth;
                    const marker = document.createElement('div');
                    marker.className = `variant-marker ${variant.variant_type.toLowerCase()}`;
                    marker.style.left = `${x}px`;
                    marker.title = `${variant.chrom}:${variant.pos} ${variant.ref_allele}>${variant.alt_alleles[0]} (${variant.variant_type}, Q=${variant.qual.toFixed(1)})`;
                    container.appendChild(marker);
                });
            });
        }

        function getBaseColor(base) {
            const colors = {
                'A': '#4ade80', 'T': '#f87171',
                'G': '#fbbf24', 'C': '#60a5fa',
                'N': '#6b7280', 'a': '#4ade80', 't': '#f87171',
                'g': '#fbbf24', 'c': '#60a5fa', 'n': '#6b7280'
            };
            return colors[String.fromCharCode(base)] || '#6b7280';
        }

        function updateStats() {
            if (!coverageData) return;

            const totalDepth = coverageData.values.reduce((a, b) => a + b, 0);
            const avgDepth = coverageData.values.length > 0 ? totalDepth / coverageData.values.length : 0;
            const maxDepth = Math.max(...coverageData.values, 1);

            document.getElementById('stat-reads').textContent = '~' + Math.round(totalDepth / 100);
            document.getElementById('stat-depth').textContent = `${avgDepth.toFixed(1)}x`;
            document.getElementById('stat-max').textContent = `${maxDepth}x`;

            let totalVariants = 0;
            variantData.forEach(f => { if (f) totalVariants += f.length; });
            document.getElementById('stat-variants').textContent = totalVariants.toString();

            if (pileupData) {
                let mapped = pileupData.columns.reduce((sum, col) =>
                    sum + col.reads.filter(r => !r.is_deletion).length, 0);
                document.getElementById('stat-mapped').textContent = `${Math.round(mapped / pileupData.columns.length * 10) / 10}`;
                document.getElementById('stat-mapq').textContent = '30';
            }
        }

        function setLoading(loading, text = 'Processing...') {
            isLoading = loading;
            const overlay = document.getElementById('loading');
            const statusDot = document.getElementById('status-dot');

            if (loading) {
                overlay.classList.remove('hidden');
                document.getElementById('loading-text').textContent = text;
                statusDot.classList.add('loading');
                updateStatus(text, 'loading');
            } else {
                overlay.classList.add('hidden');
                statusDot.classList.remove('loading');
                updateStatus('Ready', 'ready');
            }
        }

        function updateStatus(text, status) {
            document.getElementById('status-text').textContent = text;
        }

        function handleCanvasHover(e) {
            const rect = readCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pos = currentRegion.start + (x / rect.width) * (currentRegion.end - currentRegion.start);
            document.getElementById('cursor-pos').textContent = `Pos: ${formatNumber(Math.floor(pos))}`;
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('visible');
        }

        function shareView() {
            const state = {
                ref: currentRegion.ref,
                start: currentRegion.start,
                end: currentRegion.end,
                zoom
            };
            const shareData = btoa(JSON.stringify(state));
            const url = `${window.location.origin}${window.location.pathname}?s=${shareData}`;

            navigator.clipboard.writeText(url).then(() => {
                alert('Share link copied!');
            }).catch(() => {
                prompt('Copy this link:', url);
            });
        }

        function exportView() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = readCanvas.width;
            canvas.height = readCanvas.height + coverageCanvas.height + 100;

            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(coverageCanvas, 0, 0);
            ctx.drawImage(readCanvas, 0, coverageCanvas.height);

            ctx.fillStyle = '#e0e0e0';
            ctx.font = '14px sans-serif';
            ctx.fillText(
                `Chromatiq: ${currentRegion.ref}:${currentRegion.start}-${currentRegion.end}`,
                20, canvas.height - 30
            );

            const link = document.createElement('a');
            link.download = `chromatiq_${currentRegion.ref}_${currentRegion.start}-${currentRegion.end}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        function findVariants() {
            setLoading(true, 'Finding variants...');
            setTimeout(() => {
                setLoading(false);
                alert(`Found ${variantData.reduce((sum, f) => sum + (f?.length || 0), 0)} variants`);
            }, 500);
        }

        function toggleVariants() {
            showVariants = !showVariants;
            document.getElementById('show-variants-btn').textContent =
                showVariants ? 'Hide Variants' : 'Show Variants';
            if (pileupData) renderReads();
        }

        window.removeBamFile = function(index) {
            engine.unload_bam(index);
            updateLoadedFilesList();
            updateReferenceSelect();
        };

        window.removeVcfFile = function(index) {
            engine.unload_vcf(index);
            variantData.splice(index, 1);
            updateLoadedFilesList();
        };

        initialize();
    </script>
</body>
</html>
