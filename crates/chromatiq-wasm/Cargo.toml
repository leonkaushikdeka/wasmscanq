[package]
name = "chromatiq-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for Chromatiq genomic visualization engine"
documentation = "https://github.com/chromatiq/chromatiq#readme"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
chromatiq-core = { path = "../chromatiq-core" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
rand = "0.8"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "File",
    "FileReader",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
